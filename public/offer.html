<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Juniper Salon · Earlier appointment</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="offer-page">
    <p class="demo-nav"><a href="/">← Back to staff dashboard</a> <span class="muted small">(demo navigation; clients only see the page below)</span></p>
    <main class="card phone">
      <p class="muted small">Simulated text message from Juniper Salon</p>
      <h1>An earlier appointment opened up</h1>
      <div id="offer"><p class="muted">Loading…</p></div>
      <div id="actions" class="controls" hidden>
        <button id="accept">Yes, book me</button>
        <button id="decline" class="secondary">No thanks</button>
      </div>
      <p id="result" class="result" hidden></p>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const openingId = params.get("opening");
      const clientId = params.get("client");
      const offerEl = document.querySelector("#offer");
      const actions = document.querySelector("#actions");
      const resultEl = document.querySelector("#result");
      let expiresAt;

      async function load() {
        const response = await fetch(`/api/openings/${encodeURIComponent(openingId)}`);
        if (!response.ok) {
          offerEl.innerHTML = "<p>This offer could not be found.</p>";
          return;
        }
        const state = await response.json();
        const me = state.candidates.find((c) => c.client.id === clientId);
        const o = state.opening;
        const when = new Date(o.startsAt).toLocaleString([], { weekday: "long", month: "long", day: "numeric", hour: "numeric", minute: "2-digit" });
        offerEl.innerHTML = `
          <p>Hi ${me ? me.client.name.split(" ")[0] : "there"}, a spot you asked for is available:</p>
          <dl>
            <dt>Service</dt><dd>${o.service}</dd>
            <dt>Stylist</dt><dd>${o.stylist}</dd>
            <dt>When</dt><dd>${when}</dd>
          </dl>
          <p class="countdown" id="countdown"></p>`;
        expiresAt = me?.expiresAt;
        const closed = closedMessage(state, me);
        if (closed) {
          showResult(closed.text, closed.outcome);
        } else {
          actions.hidden = false;
        }
        tick();
      }

      // Explains why this client can no longer respond, or returns null if they can.
      function closedMessage(state, me) {
        if (!me) return { text: "This offer isn't for you.", outcome: "no_longer_available" };
        if (me.status === "accepted") return { text: "You're booked. See you then!", outcome: "booked" };
        if (me.status === "declined") return { text: "You declined this opening. You're still on the waitlist.", outcome: "declined" };
        if (me.status !== "offered" || state.phase !== "offering") {
          return { text: "Sorry, this opening is no longer available. You're still on the waitlist.", outcome: "no_longer_available" };
        }
        return null;
      }

      function showResult(text, outcome) {
        resultEl.textContent = text;
        resultEl.className = `result ${outcome}`;
        resultEl.hidden = false;
        actions.hidden = true;
      }

      function tick() {
        const el = document.querySelector("#countdown");
        if (!el || !expiresAt) return;
        const s = Math.max(0, Math.round((new Date(expiresAt) - Date.now()) / 1000));
        if (!resultEl.hidden) {
          el.textContent = "";
        } else if (s > 0) {
          el.textContent = `Please reply within ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
        } else {
          el.textContent = "";
          showResult("Sorry, the time to reply has passed and this opening is no longer available. You're still on the waitlist.", "no_longer_available");
        }
      }
      setInterval(tick, 1000);

      async function respond(accept) {
        actions.querySelectorAll("button").forEach((b) => (b.disabled = true));
        const response = await fetch(`/api/openings/${encodeURIComponent(openingId)}/respond`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ clientId, accept }),
        });
        const result = await response.json();
        showResult(result.message ?? result.error, result.outcome ?? "error");
      }
      document.querySelector("#accept").onclick = () => respond(true);
      document.querySelector("#decline").onclick = () => respond(false);
      load();
    </script>
  </body>
</html>
