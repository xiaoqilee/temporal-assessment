<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Juniper Salon · Openings</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>Juniper Salon</h1>
      <p>Fill cancelled appointments from the waitlist, one client at a time.</p>
    </header>
    <main>
      <section class="card">
        <h2>Post a cancelled appointment</h2>
        <form id="opening-form" class="grid">
          <label>Service
            <select name="service">
              <option>Cut &amp; style</option><option>Color</option><option>Trim</option><option>Blowout</option>
            </select>
          </label>
          <label>Stylist
            <select name="stylist"><option>Carla</option><option>Lena</option><option>Sam</option></select>
          </label>
          <label>Date &amp; time <input name="startsAt" type="datetime-local" required /></label>
          <label>Reply window
            <select name="replyWindowSeconds">
              <option value="900" selected>15 minutes (salon default)</option>
              <option value="120">2 minutes</option>
              <option value="30">30 seconds (demo only)</option>
            </select>
          </label>
          <button type="submit">Start offering</button>
        </form>
        <p id="form-error" class="error" hidden></p>
      </section>

      <section>
        <h2>Openings</h2>
        <div id="openings"><p class="muted">No openings yet. Post a cancellation above.</p></div>
      </section>

      <section class="card">
        <h2>Waitlist <span class="muted small">(simulated Google Sheet, earliest first)</span></h2>
        <table>
          <thead><tr><th>Joined</th><th>Name</th><th>Service</th><th>Stylist</th><th>Days</th><th>Times</th></tr></thead>
          <tbody id="waitlist"></tbody>
        </table>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
